name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, then Testcontainers integration tests (SQLite + PostgreSQL, Valkey)
      - run: mvn -B verify

  # Mutation testing (PIT) — only on pull requests into main, i.e. milestone merges.
  # Fails unless every mutant is killed (mutationThreshold in the pitest profile).
  mutation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -Ppitest test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports

  proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          # Breaking-change check against main on pull requests
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t yardmaster:ci .
      - name: Start with Compose and check readiness
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/readyz; then echo; exit 0; fi
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yardmaster:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
