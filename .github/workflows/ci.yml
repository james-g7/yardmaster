name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, then Testcontainers integration tests (SQLite + PostgreSQL, Valkey)
      - run: mvn -B verify

  proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          # Breaking-change check against main on pull requests
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t yardmaster:ci .
      - name: Start with Compose and check readiness
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/readyz; then echo; exit 0; fi
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yardmaster:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
